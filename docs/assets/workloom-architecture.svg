<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Workloom architecture</title>
  <desc id="desc">Agents connect through MCP or CLI to one application core backed by repository-local text state and Git</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#070B14"/>
  <circle cx="1040" cy="40" r="150" fill="#2563EB" opacity=".08"/>
  <circle cx="130" cy="540" r="190" fill="#7C3AED" opacity=".08"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="54" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700">One project. Any coding agent. Full history in Git.</text>
    <text x="600" y="82" text-anchor="middle" fill="#94A3B8" font-size="14">一个项目 · 任意编码 Agent · 完整历史归档于 Git</text>

    <g>
      <rect x="50" y="132" width="220" height="282" rx="20" fill="url(#panel)" stroke="#334155"/>
      <text x="160" y="171" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700">Coding Agents</text>
      <text x="160" y="194" text-anchor="middle" fill="#64748B" font-size="12">编码 Agent</text>
      <g fill="#0F172A" stroke="#334155">
        <rect x="78" y="222" width="164" height="42" rx="10"/>
        <rect x="78" y="279" width="164" height="42" rx="10"/>
        <rect x="78" y="336" width="164" height="42" rx="10"/>
      </g>
      <g fill="#CBD5E1" font-size="14" text-anchor="middle">
        <text x="160" y="248">Codex</text>
        <text x="160" y="305">Claude Code</text>
        <text x="160" y="362">OpenCode / Others</text>
      </g>
    </g>

    <g>
      <rect x="333" y="132" width="200" height="282" rx="20" fill="url(#panel)" stroke="#334155"/>
      <text x="433" y="171" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700">Interfaces</text>
      <text x="433" y="194" text-anchor="middle" fill="#64748B" font-size="12">统一接口</text>
      <g fill="#0F172A" stroke="#3B82F6">
        <rect x="361" y="222" width="144" height="42" rx="10"/>
        <rect x="361" y="279" width="144" height="42" rx="10"/>
        <rect x="361" y="336" width="144" height="42" rx="10"/>
      </g>
      <g fill="#DBEAFE" font-size="14" font-weight="600" text-anchor="middle">
        <text x="433" y="248">MCP</text>
        <text x="433" y="305">CLI</text>
        <text x="433" y="362">File exchange</text>
      </g>
    </g>

    <g>
      <rect x="596" y="112" width="306" height="322" rx="24" fill="url(#panel)" stroke="url(#accent)" stroke-width="2"/>
      <rect x="620" y="137" width="258" height="54" rx="12" fill="#172033"/>
      <text x="749" y="169" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700">Workloom Core</text>
      <g fill="#111827" stroke="#334155">
        <rect x="620" y="213" width="119" height="54" rx="10"/>
        <rect x="759" y="213" width="119" height="54" rx="10"/>
        <rect x="620" y="287" width="119" height="54" rx="10"/>
        <rect x="759" y="287" width="119" height="54" rx="10"/>
        <rect x="620" y="361" width="258" height="48" rx="10"/>
      </g>
      <g fill="#CBD5E1" font-size="13" text-anchor="middle">
        <text x="679" y="245">Blueprint · Tasks</text>
        <text x="818" y="245">Workflows</text>
        <text x="679" y="319">Gates · Approvals</text>
        <text x="818" y="319">Dispatch · Runs</text>
        <text x="749" y="391">Context · Knowledge · Recovery</text>
      </g>
    </g>

    <g>
      <rect x="965" y="132" width="185" height="282" rx="20" fill="url(#panel)" stroke="#334155"/>
      <text x="1057" y="171" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700">Project State</text>
      <text x="1057" y="194" text-anchor="middle" fill="#64748B" font-size="12">项目内状态</text>
      <rect x="993" y="222" width="129" height="96" rx="12" fill="#0F172A" stroke="#8B5CF6"/>
      <text x="1057" y="261" text-anchor="middle" fill="#EDE9FE" font-size="18" font-weight="700">.devsys/</text>
      <text x="1057" y="288" text-anchor="middle" fill="#A78BFA" font-size="12">YAML · JSONL · MD</text>
      <rect x="993" y="340" width="129" height="42" rx="10" fill="#172033" stroke="#475569"/>
      <text x="1057" y="366" text-anchor="middle" fill="#CBD5E1" font-size="14" font-weight="600">Git</text>
    </g>

    <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M270 273h51"/>
      <path d="M533 273h51"/>
      <path d="M902 273h51"/>
      <path d="M1057 318v12"/>
    </g>

    <g fill="#94A3B8" font-size="12" text-anchor="middle">
      <text x="300" y="260">connect</text>
      <text x="559" y="260">validate</text>
      <text x="928" y="260">persist</text>
    </g>

    <rect x="235" y="478" width="730" height="44" rx="22" fill="#111827" stroke="#334155"/>
    <circle cx="275" cy="500" r="5" fill="#38BDF8" filter="url(#glow)"/>
    <text x="600" y="505" text-anchor="middle" fill="#CBD5E1" font-size="14">No shared database · No daemon required · No harness lock-in</text>
  </g>
</svg>

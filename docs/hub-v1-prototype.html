    .list-head, .list .row { grid-template-columns: 78px minmax(0, 1fr); }

    .k-head { flex-wrap: wrap; }
  }
</style>

    knowledge: [`<h2>知识</h2><p class="meta">repowiki 页面相对代码的新鲜度。</p>`, unavailable ? emptyBox("知识读不到", "目录缺失，新鲜度无法判断") : (() => { const k = x.knowledge || {}; const dotCls = k.status === "新鲜" ? "ok" : k.status === "过期" ? "warn" : "bad"; const label = k.status === "新鲜" ? "知识新鲜" : k.status === "过期" ? "知识已过期" : "无法评估"; return `<section class="card"><div class="k-head"><span class="dot ${dotCls}"></span><b>${label}</b>${k.indexReady ? `<span class="k-time">索引可用 · 变更 ${k.changedFiles || 0} 个文件</span>` : ""}</div>${k.reason ? `<p class="row-sub" style="margin:10px 0 0">${k.reason}</p>` : ""}${k.pages?.length ? `<div class="k-pages">${k.pages.map((p) => `<div class="k-page"><span>受影响页面</span><span class="rid" style="margin-left:auto">${p}</span></div>`).join("")}</div>` : `<p class="row-sub" style="margin:10px 0 0">没有受影响的页面。</p>`}</section>`; })()]
  };
  box.innerHTML = missingBanner + tables[section].join("");
}
function refreshBar() {
  const el = $("#refresh");
  if (el) el.textContent = "演示快照 · 不自动刷新";
}
function paint() {
  renderNav();
  renderMain();
  $("#main").insertAdjacentHTML("afterbegin", '<p id="refresh"></p>');
  refreshBar();
}
$("#nav").addEventListener("click", (e) => {
  const task = e.target.closest("[data-task]");
  const sec = e.target.closest("[data-section]");
  if (task) { section = "task"; selected = task.dataset.task; }
  else if (sec) section = sec.dataset.section;
  else return;
  paint();
});
$("#main").addEventListener("click", (e) => {
  const project = e.target.closest("[data-repo]");
  if (project) { repo = project.dataset.repo; section = "blueprint"; selected = d().items[0]?.id || ""; paint(); return; }
  const chip = e.target.closest(".taskchip[data-task]");
  if (!chip) return;
  section = "task"; selected = chip.dataset.task; paint();
});
$("#nav-toggle").addEventListener("click", () => {
  const nav = document.querySelector("nav");
  const open = nav.classList.toggle("collapsed");
  $("#nav-toggle").setAttribute("aria-expanded", String(!open));
});
$("#repo").addEventListener("change", () => { repo = $("#repo").value; section = "blueprint"; selected = d().items[0]?.id || ""; paint(); });
paint();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workloom hub</title>
<style>
  :root {
    color-scheme: light;
    --bg: #efece6; --ink: #1c1915; --muted: #6e675e; --line: #ddd6ca;
    --card: #fffdf9; --soft: #f3eee6; --on: #1c1915; --on-ink: #f7f4ee;
    --wait: #8a4b08; --wait-bg: #fbf0dc; --bad: #9b2c2c; --bad-bg: #f8e6e4;
    --focus: #0b57d0;
    --sans: system-ui, "Segoe UI", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 14px; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  nav { background: var(--card); border-right: 1px solid var(--line); padding: 12px; overflow: auto; }
  nav header { padding: 4px 6px 10px; }
  h1 { margin: 0; font-size: 15px; }
  .path { margin: 3px 0 8px; color: var(--muted); font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
  select { width: 100%; height: 32px; border: 1px solid #c9c0b2; border-radius: 8px; background: var(--bg); padding: 0 8px; }
  #nav { display: flex; flex-direction: column; }
  .group { display: flex; flex-direction: column; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .nav-label {
    margin: 0 8px 6px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .04em;
  }
  .group > button, .sub button {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: 0; background: transparent; min-height: 36px;
  }
  .group > button { border-radius: 8px; padding: 7px 8px; font-weight: 650; }
  .sub { display: flex; flex-direction: column; margin-left: 8px; padding-left: 10px; border-left: 2px solid var(--line); }
  .sub button { border-radius: 6px; padding: 6px 8px; font-weight: 450; color: #3d3832; }
  #nav button[aria-current="true"] { background: var(--on); color: var(--on-ink); font-weight: 650; }
  #nav button small { color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 450; }
  #nav button[aria-current="true"] small { color: #c8c0b4; }
  main { min-width: 0; overflow: auto; padding: 22px 28px 48px; }
  main h2 { margin: 0 0 4px; font-size: 22px; }
  .meta { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 3px 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row b { font-weight: 650; }
  .flag { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 99px; background: var(--wait-bg); color: var(--wait); font-size: 12px; }
  .flag.bad { background: var(--bad-bg); color: var(--bad); }
  .track { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .step.now { background: var(--on); color: var(--on-ink); }
  .note { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <nav>
    <header>
      <h1>workloom</h1>
      <p class="path" id="path"></p>
      <select id="repo" aria-label="仓库">
        <option value="workloom">workloom</option>
        <option value="notes">notes · 缺失</option>
      </select>
    </header>

    <div id="nav"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
const FLOWS = {
  "feature-development": { name: "功能开发", steps: ["检查", "澄清", "计划", "实施", "验证", "完成"] },
  "quick-fix": { name: "快速修复", steps: ["检查", "实施", "验证", "完成"] },
  "architecture-change": { name: "架构变更", steps: ["分析", "比较", "决定", "实施", "验证", "完成"] }
};
const DATA = {
  workloom: {
    path: "C:/Source/CodeSource/ai/Workloom",
    blueprint: { name: "Workloom", phase: "多仓只读视图", goals: ["本机登记多个仓库", "打开才读取"], in: ["注册表", "只读装配"], out: ["不改任务", "不审批"], milestones: [["m-hub", "本地多仓视图", "open"]] },
    state: { summary: "方案已定，页面未实现", risks: ["待审批"], blockers: [], next: ["先做 hub serve"] },
    items: [
      { id: "hub-serve", title: "只绑本机并嵌入页面", status: "进行中", flow: "feature-development", step: "实施", who: "agent-a" },
      { id: "reg-delete", title: "注册表按 id 删除", status: "阻塞", flow: "feature-development", step: "计划", paused: true },
      { id: "hub-poll", title: "当前仓两秒刷新", status: "就绪", flow: "quick-fix", step: "检查" },
      { id: "view-bind", title: "打开仓库时带上 etag", status: "评审", flow: "architecture-change", step: "决定", who: "agent-b", approval: "离开评审需要批准，还没批" },
      { id: "hub-docs", title: "命令说明写入 help", status: "待办", flow: "" }
    ],
    approvals: [["approval-1", "view-bind", "申请中"]],
    records: { decisions: [["d-12", "用轮询，不监听文件"]], findings: [["f-4", "注册表没有删除"]], artifacts: [["a-3", "hub-v1.md"]] },
    runs: [["run-18", "hub-serve", "进行中"], ["run-17", "view-bind", "完成"], ["run-16", "reg-delete", "失败"]],
    knowledge: { status: "过期", pages: ["视图数据模型", "工作区命令"] },
    next: "先处理 view-bind 的批准"
  },
  notes: { path: "D:/archive/notes", missing: true }
};
let repo = "workloom", section = "tasks", selected = "hub-serve";
const $ = (s) => document.querySelector(s);
const d = () => DATA[repo];

function navButton(id, label, count, current) {
  return `<button type="button" data-section="${id}" aria-current="${current}"><span>${label}</span><small>${count}</small></button>`;
}
function renderNav() {
  const x = d();
  $("#path").textContent = x.path;
  if (x.missing) { $("#nav").innerHTML = ""; return; }
  const items = x.items.map((it) => `<button class="item" type="button" data-task="${it.id}" aria-current="${section === "task" && selected === it.id}"><span>${it.title}</span></button>`).join("");
  const rec = x.records.decisions.length + x.records.findings.length + x.records.artifacts.length;
  $("#nav").innerHTML = `<div class="group"><div class="nav-label">项目</div>${navButton("blueprint", "蓝图", "", section === "blueprint")}${navButton("state", "当前状态", "", section === "state")}</div><div class="group"><div class="nav-label">任务 ${x.items.length}</div><div class="sub">${items}</div></div><div class="group"><div class="nav-label">其它</div>${navButton("flows", "工作流", Object.keys(FLOWS).length, section === "flows")}${navButton("approvals", "审批", x.approvals.length, section === "approvals")}${navButton("records", "记录", rec, section === "records")}${navButton("runs", "运行", x.runs.length, section === "runs")}${navButton("knowledge", "知识", x.knowledge.status, section === "knowledge")}</div>`;
}
function taskDetail(it) {
  const flow = FLOWS[it.flow];
  const flowCard = flow
    ? `<p><b>${flow.name}</b> · 现在在「${it.step}」</p><div class="track">${flow.steps.map((s) => `<span class="step${s === it.step ? " now" : ""}">${s}</span>`).join("")}</div>${it.paused ? `<span class="flag bad">工作流已暂停</span>` : `<p class="note">推进步骤不会改状态。</p>`}`
    : `<p>没绑定。状态仍然可以改。</p>`;
  return `<h2>${it.title}</h2><p class="meta">${it.id}</p><div class="grid">
    <section class="card"><h3>任务状态</h3><p><b>${it.status}</b></p>${it.approval ? `<span class="flag">${it.approval}</span>` : `<p class="note">${it.who ? "领取人 " + it.who + "。" : ""}改状态不会移动步骤。</p>`}</section>
    <section class="card"><h3>工作流</h3>${flowCard}</section></div>
    <p class="note">两边各自改，互不带动。</p>`;
}
function renderMain() {
  const x = d();
  const box = $("#main");
  if (x.missing) { box.innerHTML = `<h2>仓库缺失</h2><p>路径还在，目录没了。不显示任务和蓝图。</p>`; return; }
  if (section === "task") { box.innerHTML = taskDetail(x.items.find((it) => it.id === selected)); return; }
  if (section === "blueprint") {
    const b = x.blueprint;
    box.innerHTML = `<h2>${b.name}</h2><p class="meta">当前阶段：${b.phase}</p><div class="grid">
      <section class="card"><h3>目标</h3><ul>${b.goals.map((g) => `<li>${g}</li>`).join("")}</ul></section>
      <section class="card"><h3>里程碑</h3><ul>${b.milestones.map((m) => `<li>${m[1]} · ${m[2]}</li>`).join("")}</ul></section>
      <section class="card"><h3>范围内</h3><ul>${b.in.map((g) => `<li>${g}</li>`).join("")}</ul></section>
      <section class="card"><h3>范围外</h3><ul>${b.out.map((g) => `<li>${g}</li>`).join("")}</ul></section></div>`;
    return;
  }
  if (section === "state") {
    const s = x.state;
    box.innerHTML = `<h2>当前状态</h2><p class="meta">${s.summary}</p><div class="grid">
      <section class="card"><h3>风险</h3>${s.risks.map((r) => `<p>${r}</p>`).join("") || "<p class='note'>无</p>"}</section>
      <section class="card"><h3>阻塞</h3>${s.blockers.map((r) => `<p>${r}</p>`).join("") || "<p class='note'>无</p>"}</section>
      <section class="card"><h3>下一步重点</h3><ul>${s.next.map((r) => `<li>${r}</li>`).join("")}</ul></section>
      <section class="card"><h3>下一步建议</h3><p>${x.next}</p></section></div>`;
    return;
  }
  if (section === "flows") {
    box.innerHTML = `<h2>这个仓的工作流</h2><p class="meta">一份流程可被多个任务共用。</p>` + Object.entries(FLOWS).map(([id, f]) => {
      const users = x.items.filter((it) => it.flow === id);
      return `<section class="card" style="margin-bottom:10px"><h3>${f.name}</h3><div class="track">${f.steps.map((s) => `<span class="step">${s}</span>`).join("")}</div><p class="note">${users.length ? "正在用：" + users.map((it) => it.title).join("、") : "还没有任务使用"}</p></section>`;
    }).join("");
    return;
  }
  const tables = {
    approvals: [`<h2>审批</h2>`, x.approvals.map((a) => `<div class="row"><b>${a[0]}</b><span>${a[1]} · ${a[2]}</span></div>`).join("")],
    records: [`<h2>记录</h2>`, ["决策", "发现", "产物"].map((name, i) => `<section class="card" style="margin-bottom:10px"><h3>${name}</h3>${Object.values(x.records)[i].map((r) => `<p>${r[0]} · ${r[1]}</p>`).join("")}</section>`).join("")],
    runs: [`<h2>运行</h2>`, x.runs.map((r) => `<div class="row"><b>${r[0]}</b><span>${r[1]} · ${r[2]}</span></div>`).join("") + `<p class="note">事件正文这版不展开。</p>`],
    knowledge: [`<h2>知识</h2><p class="meta">${x.knowledge.status}</p>`, x.knowledge.pages.map((p) => `<div class="row"><span>${p}</span></div>`).join("")]
  };
  box.innerHTML = tables[section].join("");
}
function paint() { renderNav(); renderMain(); }
$("#nav").addEventListener("click", (e) => {
  const task = e.target.closest("[data-task]");
  const sec = e.target.closest("[data-section]");
  if (task) { section = "task"; selected = task.dataset.task; }
  else if (sec) section = sec.dataset.section;
  else return;
  paint();
});
$("#repo").addEventListener("change", () => { repo = $("#repo").value; section = "blueprint"; paint(); });
paint();
</script>
</body>
</html>

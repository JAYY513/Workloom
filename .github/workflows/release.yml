name: release

# Publish the workloom 6-platform binaries + install scripts + SHA-256 checksums + npm tarballs to a GitHub Release, then publish the npm packages via OIDC trusted publishing (no long-lived token).
#
# Triggers:
#   - pushing a v* tag (automatic)
#   - workflow_dispatch: name an existing tag, optionally as a draft and with
#     custom release notes
#
# Cost: one ubuntu-latest runner (Linux 1x multiplier), roughly 2-4 minutes per
# release. The build reuses scripts/build-release.sh, so CI artifacts and local
# `make release` artifacts come from the same code path.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist on origin)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft (verify before publishing)"
        required: false
        default: false
        type: boolean
      notes:
        description: "Release notes (empty generates them from the tag history)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # Trusted publishing: npm CLI exchanges this OIDC token for a short-lived
  # publish token against the per-package trusted publisher configured on
  # npmjs.com. No NPM_TOKEN secret exists in this repo.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$TAG_INPUT"
          else
            version="$REF_NAME"
          fi
          [ -n "$version" ] || { echo "no version resolved from $EVENT" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the matrix and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh --version "$VERSION" --out dist

      - name: Verify the artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The binary must report the version being published.
          ./dist/workloom-linux-amd64 --version | grep -F "$VERSION"
          # checksums.txt must be GNU text mode: "<sha256>  <file>". macOS
          # `shasum` writes the binary marker "<sha256> *<file>", which
          # `sha256sum -c` happily accepts — that is how v0.1.0 shipped a file
          # the install scripts could not parse. Fail the release instead of
          # discovering it at install time.
          if grep -Eq '^[0-9a-f]{64} \*' dist/checksums.txt; then
            echo "checksums.txt uses shasum's binary marker ('<hash> *<file>'); regenerate it with sha256sum" >&2
            exit 1
          fi
          bad="$(grep -Evc '^[0-9a-f]{64}  [^ ]+$' dist/checksums.txt || true)"
          if [ "$bad" != "0" ]; then
            echo "checksums.txt has $bad line(s) outside '<sha256>  <file>' form" >&2
            exit 1
          fi
          # The checksum file must match the files it names.
          (cd dist && sha256sum -c checksums.txt)
          # And every published asset must be named in it.
          for asset in dist/workloom-* dist/install.sh dist/install.ps1; do
            base="$(basename "$asset")"
            if ! grep -qF "  $base" dist/checksums.txt; then
              echo "checksums.txt does not list $base" >&2
              exit 1
            fi
          done
          ls -l dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 on Node >= 22.14 is required for OIDC trusted
          # publishing (auto-detected; no NODE_AUTH_TOKEN involved).
          node-version: 24

      - name: Pack npm tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/pack-npm.sh --version "$VERSION" --dist dist --out dist/npm

      # Trusted publishing (OIDC): npm CLI detects the GitHub Actions OIDC
      # token (id-token: write above) and exchanges it for a short-lived
      # publish token. Requires the per-package trusted publisher on npmjs.com
      # (@kaki317/workloom + @kaki317/workloom-win32-x64, workflow release.yml,
      # direct publish allowed). Fails closed before the GitHub Release is
      # created if the registry side is not configured.
      - name: Publish npm packages
        run: bash scripts/publish-npm.sh --dir dist/npm

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$VERSION")
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if [ -n "$NOTES" ]; then
            args+=(--notes "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$VERSION" dist/workloom-* dist/install.sh dist/install.ps1 dist/checksums.txt dist/npm/*.tgz "${args[@]}"
